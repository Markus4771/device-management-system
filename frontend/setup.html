<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Management System – Einrichtung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:720px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 mb-2">Ersteinrichtung</h1>
      <p class="text-muted">Hinterlege hier die Zugangsdaten für die GLPI-API.</p>
      <div id="message" class="alert d-none"></div>
      <form id="setupForm">
        <label class="form-label">GLPI-Adresse</label>
        <input id="base_url" class="form-control mb-3" placeholder="http://10.0.0.100/glpi" required>
        <label class="form-label">Application Token</label>
        <input id="app_token" class="form-control mb-3" type="password" required>
        <label class="form-label">User Token</label>
        <input id="user_token" class="form-control mb-3" type="password" required>
        <div class="d-flex gap-2">
          <button type="button" id="test" class="btn btn-outline-primary">Verbindung testen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script>
const api = "/api/v1/setup";
const form = document.getElementById("setupForm");
const message = document.getElementById("message");
function show(text, ok) {
  message.textContent = text;
  message.className = "alert " + (ok ? "alert-success" : "alert-danger");
}
function data() {
  return {
    base_url: document.getElementById("base_url").value.trim(),
    app_token: document.getElementById("app_token").value.trim(),
    user_token: document.getElementById("user_token").value.trim()
  };
}
async function call(path) {
  const response = await fetch(api + path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data())
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.detail || "Unbekannter Fehler");
  return result;
}
document.getElementById("test").onclick = async () => {
  try { const r = await call("/glpi/test"); show(r.message + " (" + r.entities_count + " Kunden/Entities)", true); }
  catch (e) { show(e.message, false); }
};
form.onsubmit = async (e) => {
  e.preventDefault();
  try { const r = await call("/glpi"); show(r.message, true); form.querySelectorAll("input,button").forEach(x => x.disabled = true); }
  catch (e) { show(e.message, false); }
};
</script>
</body>
</html>
