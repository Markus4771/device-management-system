<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Management Navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: 700;
            color: white !important;
        }
        .navbar-nav .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            font-weight: 500;
        }
        .navbar-nav .nav-link:hover {
            color: white !important;
        }
        .navbar-nav .nav-link.active {
            color: white !important;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        .version-badge {
            font-size: 0.7rem;
            margin-left: 5px;
            vertical-align: middle;
        }
        .nav-item .badge {
            font-size: 0.6rem;
            margin-left: 3px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-desktop me-2"></i>
                Device Management
                <span class="version-badge badge bg-secondary">Phase 1+2</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fas fa-plus-circle me-1"></i>
                            Geräteerfassung
                            <span class="badge bg-success">Phase 1</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="network_scans.html">
                            <i class="fas fa-search me-1"></i>
                            Netzwerk Scans
                            <span class="badge bg-info">Phase 2</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="test_modules.html">
                            <i class="fas fa-vial me-1"></i>
                            Module Test
                            <span class="badge bg-warning">Testing</span>
                        </a>
                    </li>
                </ul>
                
                <div class="navbar-text text-light">
                    <small>
                        <i class="fas fa-clock me-1"></i>
                        <span id="currentTime"></span>
                        | GLPI: <span id="glpiStatus" class="badge bg-secondary">Unknown</span>
                    </small>
                </div>
            </div>
        </div>
    </nav>

    <script>
        // Aktuelle Zeit anzeigen
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }
        
        // GLPI Status prüfen
        async function checkGLPIStatus() {
            try {
                const response = await fetch('http://localhost:8000/api/v1/glpi/status');
                const statusEl = document.getElementById('glpiStatus');
                if (response.ok) {
                    statusEl.className = 'badge bg-success';
                    statusEl.textContent = 'Connected';
                } else {
                    statusEl.className = 'badge bg-danger';
                    statusEl.textContent = 'Offline';
                }
            } catch (error) {
                document.getElementById('glpiStatus').className = 'badge bg-warning';
                document.getElementById('glpiStatus').textContent = 'Error';
            }
        }
        
        // Initialisierung
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000); // Minute
            checkGLPIStatus();
            setInterval(checkGLPIStatus, 300000); // 5 Minuten
            
            // Aktiven Link markieren
            const currentPage = window.location.pathname.split('/').pop();
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
    </script>
    
    <!-- Font Awesome für Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
